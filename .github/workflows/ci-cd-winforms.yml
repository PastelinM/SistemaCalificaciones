name: CI/CD WinForms

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: windows-latest 

    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar dependencias
      run: dotnet restore

    - name: Compilar proyecto (Modo Release)
      run: dotnet build --configuration Release --no-restore

    - name: Publicar artefacto
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet publish ./SistemaCalificaciones.UI/SistemaCalificaciones.UI.csproj -c Release -o ./publish

    - name: Subir empaquetado a GitHub
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: SistemaCalificaciones-App
        path: ./publish/